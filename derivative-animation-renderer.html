<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Animation Renderer</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      },
      chtml: {
        scale: 1.05,
        displayAlign: 'center'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1d31;
      --panel-2: #14243b;
      --text: #f7f9fc;
      --muted: #aebbd0;
      --accent: #7ca7ff;
      --accent-2: #aa91ff;
      --success: #8be0b1;
      --warning: #ffd38a;
      --border: rgba(255,255,255,.12);
      --shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(124,167,255,.16), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(170,145,255,.13), transparent 28%),
        var(--bg);
    }

    button, select, textarea, input { font: inherit; }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 18px auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
    }

    .stage-shell, .sidebar {
      background: rgba(15,29,49,.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .stage-shell { overflow: hidden; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      letter-spacing: -.02em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .step-count {
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .progress-track {
      height: 5px;
      background: rgba(255,255,255,.06);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .35s ease;
    }

    .stage {
      min-height: 610px;
      padding: clamp(26px, 5vw, 52px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: auto -80px -110px auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(124,167,255,.06);
      pointer-events: none;
    }

    .step-content {
      position: relative;
      z-index: 1;
      animation: enter .48s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .eyebrow {
      color: var(--accent);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .step-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .caption {
      color: var(--muted);
      margin: 15px 0 28px;
      font-size: clamp(1rem, 1.6vw, 1.16rem);
      line-height: 1.55;
      max-width: 760px;
    }

    .equation-stack {
      display: grid;
      gap: 12px;
      margin: 0 0 18px;
    }

    .equation-row {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      border-radius: 17px;
      padding: 14px 18px;
      opacity: 0;
      transform: translateY(8px);
      animation: rowIn .4s ease forwards;
    }

    @keyframes rowIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .equation-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 7px;
    }

    .equation {
      font-size: clamp(1.15rem, 2.7vw, 1.8rem);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 3px 0;
    }

    .equation-row.rule { border-color: rgba(170,145,255,.4); background: rgba(170,145,255,.08); }
    .equation-row.primary { border-color: rgba(124,167,255,.45); background: rgba(124,167,255,.08); }
    .equation-row.final { border-color: rgba(139,224,177,.5); background: rgba(139,224,177,.09); }
    .equation-row.final .equation { font-size: clamp(1.35rem, 3.3vw, 2.15rem); }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }

    .math-card {
      border-radius: 17px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      opacity: 0;
      transform: translateY(8px);
      animation: rowIn .42s ease forwards;
    }

    .math-card.blue { background: rgba(124,167,255,.1); border-color: rgba(124,167,255,.42); }
    .math-card.violet { background: rgba(170,145,255,.1); border-color: rgba(170,145,255,.42); }

    .card-label {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card-math { font-size: clamp(1rem, 2.3vw, 1.45rem); overflow-x: auto; }

    .callout {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }

    .callout-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(124,167,255,.12);
      color: var(--accent);
      font-weight: 900;
    }

    .callout.success .callout-icon { color: var(--success); background: rgba(139,224,177,.12); }
    .callout.warning .callout-icon { color: var(--warning); background: rgba(255,211,138,.12); }

    .callout h3 { margin: 0 0 4px; font-size: .95rem; }
    .callout p { margin: 0; color: var(--muted); line-height: 1.45; font-size: .92rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 19px;
      border-top: 1px solid var(--border);
      background: rgba(8,18,32,.45);
    }

    .controls button, .controls select, .file-label {
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.055);
      color: var(--text);
      padding: 0 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .controls button:hover, .file-label:hover { background: rgba(255,255,255,.1); }
    .controls button.primary { background: var(--accent); color: #08111f; border-color: transparent; }
    .controls button:disabled { opacity: .35; cursor: default; }
    .spacer { flex: 1; }

    .sidebar {
      padding: 18px;
      align-self: start;
      position: sticky;
      top: 18px;
    }

    .sidebar h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .sidebar-intro { color: var(--muted); margin: 0 0 16px; font-size: .88rem; line-height: 1.45; }

    .problem-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      margin-bottom: 15px;
    }

    .problem-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
    .problem-math { margin-top: 9px; font-size: 1.02rem; overflow-x: auto; }

    .timeline {
      display: grid;
      gap: 7px;
      max-height: 338px;
      overflow: auto;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .timeline button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      border-radius: 11px;
      padding: 9px 10px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
    }

    .timeline button:hover { background: rgba(255,255,255,.045); }
    .timeline button.active { background: rgba(124,167,255,.11); border-color: rgba(124,167,255,.3); color: var(--text); }
    .timeline-index { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.06); font-size: .72rem; font-weight: 800; }
    .timeline-title { font-size: .83rem; font-weight: 700; }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.2);
      color: var(--text);
      padding: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .74rem;
      line-height: 1.4;
    }

    .json-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .json-actions button, .file-label {
      min-height: 39px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.055);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0 10px;
      font-size: .8rem;
      font-weight: 750;
    }
    #fileInput { display: none; }
    .status { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: .75rem; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .stage { min-height: 560px; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 14px, 1180px); margin: 7px auto; gap: 10px; }
      .stage-shell, .sidebar { border-radius: 18px; }
      .stage { padding: 25px 19px; min-height: 545px; }
      .cards { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .controls .spacer { display: none; }
      .controls select { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage-shell" aria-label="Animation stage">
      <header class="topbar">
        <div class="brand">
          <h1 id="animationTitle">Math Animation</h1>
          <p id="animationSubtitle">Structured JSON renderer</p>
        </div>
        <div class="step-count" id="stepCount">Step 1 of 1</div>
      </header>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="stage" id="stage"></div>
      <footer class="controls">
        <button id="resetBtn" title="Restart">↺ Reset</button>
        <button id="prevBtn" title="Previous step">← Previous</button>
        <button id="playBtn" class="primary" title="Play or pause">▶ Play</button>
        <button id="nextBtn" title="Next step">Next →</button>
        <div class="spacer"></div>
        <label for="speedSelect" style="color:var(--muted);font-size:.82rem;font-weight:700">Speed</label>
        <select id="speedSelect" aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </footer>
    </section>

    <aside class="sidebar">
      <h2>Animation data</h2>
      <p class="sidebar-intro">Use the built-in example, paste another compatible JSON object, or load a local <code>.json</code> file.</p>
      <div class="problem-card">
        <div class="problem-label">Current problem</div>
        <div class="problem-math" id="problemMath"></div>
      </div>
      <div class="timeline" id="timeline"></div>
      <textarea id="jsonInput" spellcheck="false" aria-label="Animation JSON"></textarea>
      <div class="json-actions">
        <button id="applyJsonBtn">Apply pasted JSON</button>
        <label class="file-label" for="fileInput">Load JSON file</label>
        <input id="fileInput" type="file" accept="application/json,.json" />
      </div>
      <div class="status" id="status"></div>
    </aside>
  </main>

  <script>
    const DEFAULT_ANIMATION = {
      "schemaVersion": "1.0",
      "animationId": "product-rule-example-001",
      "title": "Differentiate a Product",
      "subtitle": "Product Rule Walkthrough",
      "problem": {
        "prompt": "Find the derivative.",
        "latex": "y=(x^3+5x+1)(2x-1)",
        "answerLatex": "y'=8x^3-3x^2+20x-3"
      },
      "settings": {
        "defaultStepDurationMs": 4300,
        "showStepCounter": true,
        "allowKeyboardControls": true,
        "autoPlay": false
      },
      "steps": [
        {
          "id": "read-problem",
          "title": "Read the expression",
          "caption": "The function is written as one polynomial multiplied by another.",
          "equations": [{"label":"Given","latex":"y=(x^3+5x+1)(2x-1)","style":"primary"}],
          "cards": [],
          "callout": {"type":"goal","title":"Goal","text":"Differentiate the entire product without expanding first."},
          "narration": "We are differentiating a product of two functions.",
          "durationMs": 3800
        },
        {
          "id": "name-factors",
          "title": "Name the two factors",
          "caption": "Assign each factor a short name so the product rule is easier to organize.",
          "equations": [{"label":"Rewrite","latex":"y=f(x)g(x)","style":"primary"}],
          "cards": [
            {"label":"First factor","latex":"f(x)=x^3+5x+1","tone":"blue"},
            {"label":"Second factor","latex":"g(x)=2x-1","tone":"violet"}
          ],
          "callout": {"type":"tip","title":"Organization tip","text":"Keep the factor names consistent through every step."},
          "narration": "Let f of x be the first factor and g of x be the second factor.",
          "durationMs": 4300
        },
        {
          "id": "state-rule",
          "title": "Apply the product rule",
          "caption": "Differentiate one factor at a time while keeping the other factor unchanged.",
          "equations": [{"label":"Product rule","latex":"\\frac{d}{dx}[f(x)g(x)]=f'(x)g(x)+f(x)g'(x)","style":"rule"}],
          "cards": [
            {"label":"First term","latex":"f'(x)g(x)","tone":"blue"},
            {"label":"Second term","latex":"f(x)g'(x)","tone":"violet"}
          ],
          "callout": {"type":"memory","title":"Memory cue","text":"Derivative of the first times the second, plus the first times derivative of the second."},
          "narration": "The product rule produces two terms that are added together.",
          "durationMs": 5100
        },
        {
          "id": "differentiate-factors",
          "title": "Differentiate each factor",
          "caption": "Use the power rule and the derivative of a linear expression.",
          "equations": [],
          "cards": [
            {"label":"First derivative","latex":"f'(x)=3x^2+5","tone":"blue"},
            {"label":"Second derivative","latex":"g'(x)=2","tone":"violet"}
          ],
          "callout": {"type":"check","title":"Derivative check","text":"The constant terms differentiate to zero."},
          "narration": "The derivative of x cubed plus five x plus one is three x squared plus five, and the derivative of two x minus one is two.",
          "durationMs": 4700
        },
        {
          "id": "substitute-rule",
          "title": "Substitute into the rule",
          "caption": "Place each original factor and derivative into its matching product-rule position.",
          "equations": [{"label":"Substitution","latex":"y'=(3x^2+5)(2x-1)+(x^3+5x+1)(2)","style":"primary"}],
          "cards": [
            {"label":"From f'(x)g(x)","latex":"(3x^2+5)(2x-1)","tone":"blue"},
            {"label":"From f(x)g'(x)","latex":"(x^3+5x+1)(2)","tone":"violet"}
          ],
          "callout": {"type":"warning","title":"Common mistake","text":"Do not multiply the two derivatives together."},
          "narration": "Now substitute the two derivatives and the two original factors into the product rule.",
          "durationMs": 5200
        },
        {
          "id": "expand-products",
          "title": "Expand both products",
          "caption": "Distribute carefully, preserving every sign and term.",
          "equations": [
            {"label":"First product","latex":"(3x^2+5)(2x-1)=6x^3-3x^2+10x-5","style":"secondary"},
            {"label":"Second product","latex":"2(x^3+5x+1)=2x^3+10x+2","style":"secondary"},
            {"label":"Together","latex":"y'=6x^3-3x^2+10x-5+2x^3+10x+2","style":"primary"}
          ],
          "cards": [],
          "callout": {"type":"check","title":"Sign check","text":"Multiplying by negative one creates −3x² and −5 in the first product."},
          "narration": "Expand each product, then place all terms into one expression.",
          "durationMs": 6200
        },
        {
          "id": "combine-like-terms",
          "title": "Combine like terms",
          "caption": "Group terms with the same power of x.",
          "equations": [
            {"label":"Cubic terms","latex":"6x^3+2x^3=8x^3","style":"secondary"},
            {"label":"Quadratic term","latex":"-3x^2","style":"secondary"},
            {"label":"Linear terms","latex":"10x+10x=20x","style":"secondary"},
            {"label":"Constants","latex":"-5+2=-3","style":"secondary"}
          ],
          "cards": [],
          "callout": {"type":"tip","title":"Combine only like terms","text":"Terms can combine only when their variable parts match exactly."},
          "narration": "Combine the cubic terms, keep the quadratic term, combine the linear terms, and combine the constants.",
          "durationMs": 5700
        },
        {
          "id": "final-answer",
          "title": "Final derivative",
          "caption": "The derivative is now simplified completely.",
          "equations": [{"label":"Answer","latex":"\\boxed{y'=8x^3-3x^2+20x-3}","style":"final"}],
          "cards": [],
          "callout": {"type":"success","title":"Complete","text":"The result could also be checked by expanding the original function first and differentiating afterward."},
          "narration": "The final derivative is eight x cubed minus three x squared plus twenty x minus three.",
          "durationMs": 5200
        }
      ]
    };

    const els = {
      stage: document.getElementById('stage'),
      title: document.getElementById('animationTitle'),
      subtitle: document.getElementById('animationSubtitle'),
      stepCount: document.getElementById('stepCount'),
      progressFill: document.getElementById('progressFill'),
      problemMath: document.getElementById('problemMath'),
      timeline: document.getElementById('timeline'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      playBtn: document.getElementById('playBtn'),
      resetBtn: document.getElementById('resetBtn'),
      speedSelect: document.getElementById('speedSelect'),
      jsonInput: document.getElementById('jsonInput'),
      applyJsonBtn: document.getElementById('applyJsonBtn'),
      fileInput: document.getElementById('fileInput'),
      status: document.getElementById('status')
    };

    let animation = structuredClone(DEFAULT_ANIMATION);
    let currentStep = 0;
    let playing = false;
    let playTimer = null;

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function validateAnimation(data) {
      if (!data || typeof data !== 'object') throw new Error('Top-level JSON must be an object.');
      if (!Array.isArray(data.steps) || data.steps.length === 0) throw new Error('The JSON must contain a non-empty steps array.');
      data.steps.forEach((step, index) => {
        if (!step.title) throw new Error(`Step ${index + 1} is missing a title.`);
        if (step.equations && !Array.isArray(step.equations)) throw new Error(`Step ${index + 1} equations must be an array.`);
        if (step.cards && !Array.isArray(step.cards)) throw new Error(`Step ${index + 1} cards must be an array.`);
      });
      return true;
    }

    function mathWrap(latex) {
      return `\\[${latex || ''}\\]`;
    }

    function iconFor(type) {
      return ({
        goal: '◎', tip: '✦', memory: '↺', check: '✓', warning: '!', success: '✓'
      })[type] || '•';
    }

    function renderTimeline() {
      els.timeline.innerHTML = animation.steps.map((step, i) => `
        <button type="button" data-step="${i}" class="${i === currentStep ? 'active' : ''}">
          <span class="timeline-index">${i + 1}</span>
          <span class="timeline-title">${escapeHtml(step.title)}</span>
        </button>
      `).join('');
      els.timeline.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          pause();
          currentStep = Number(button.dataset.step);
          render();
        });
      });
    }

    async function typeset(elements) {
      if (!window.MathJax?.typesetPromise) return;
      try {
        await window.MathJax.typesetPromise(elements);
      } catch (error) {
        console.error('MathJax typesetting error:', error);
      }
    }

    async function render() {
      const step = animation.steps[currentStep];
      const equations = (step.equations || []).map((eq, index) => `
        <div class="equation-row ${escapeHtml(eq.style || 'secondary')}" style="animation-delay:${index * 110}ms">
          <div class="equation-label">${escapeHtml(eq.label || '')}</div>
          <div class="equation">${mathWrap(eq.latex)}</div>
        </div>
      `).join('');

      const cards = (step.cards || []).map((card, index) => `
        <div class="math-card ${escapeHtml(card.tone || '')}" style="animation-delay:${(index + 1) * 120}ms">
          <div class="card-label">${escapeHtml(card.label || '')}</div>
          <div class="card-math">${mathWrap(card.latex)}</div>
        </div>
      `).join('');

      const callout = step.callout ? `
        <div class="callout ${escapeHtml(step.callout.type || '')}">
          <div class="callout-icon">${iconFor(step.callout.type)}</div>
          <div>
            <h3>${escapeHtml(step.callout.title || '')}</h3>
            <p>${escapeHtml(step.callout.text || '')}</p>
          </div>
        </div>
      ` : '';

      els.stage.innerHTML = `
        <article class="step-content">
          <div class="eyebrow">Step ${currentStep + 1}</div>
          <h2 class="step-title">${escapeHtml(step.title)}</h2>
          <p class="caption">${escapeHtml(step.caption || '')}</p>
          ${equations ? `<div class="equation-stack">${equations}</div>` : ''}
          ${cards ? `<div class="cards">${cards}</div>` : ''}
          ${callout}
        </article>
      `;

      els.title.textContent = animation.title || 'Math Animation';
      els.subtitle.textContent = animation.subtitle || '';
      els.stepCount.textContent = `Step ${currentStep + 1} of ${animation.steps.length}`;
      els.progressFill.style.width = `${((currentStep + 1) / animation.steps.length) * 100}%`;
      els.prevBtn.disabled = currentStep === 0;
      els.nextBtn.disabled = currentStep === animation.steps.length - 1;
      els.problemMath.innerHTML = mathWrap(animation.problem?.latex || '');

      renderTimeline();
      await typeset([els.stage, els.problemMath]);
    }

    function getStepDuration() {
      const speed = Number(els.speedSelect.value) || 1;
      const raw = animation.steps[currentStep]?.durationMs || animation.settings?.defaultStepDurationMs || 4300;
      return Math.max(700, raw / speed);
    }

    function scheduleNext() {
      clearTimeout(playTimer);
      if (!playing) return;
      playTimer = setTimeout(() => {
        if (currentStep < animation.steps.length - 1) {
          currentStep += 1;
          render().then(scheduleNext);
        } else {
          pause();
        }
      }, getStepDuration());
    }

    function play() {
      if (playing) return;
      if (currentStep === animation.steps.length - 1) currentStep = 0;
      playing = true;
      els.playBtn.textContent = '❚❚ Pause';
      render().then(scheduleNext);
    }

    function pause() {
      playing = false;
      clearTimeout(playTimer);
      playTimer = null;
      els.playBtn.textContent = '▶ Play';
    }

    function loadAnimation(data, sourceLabel = 'JSON loaded') {
      validateAnimation(data);
      pause();
      animation = data;
      currentStep = 0;
      els.jsonInput.value = JSON.stringify(animation, null, 2);
      els.status.textContent = sourceLabel;
      render();
    }

    els.prevBtn.addEventListener('click', () => {
      pause();
      currentStep = Math.max(0, currentStep - 1);
      render();
    });

    els.nextBtn.addEventListener('click', () => {
      pause();
      currentStep = Math.min(animation.steps.length - 1, currentStep + 1);
      render();
    });

    els.playBtn.addEventListener('click', () => playing ? pause() : play());

    els.resetBtn.addEventListener('click', () => {
      pause();
      currentStep = 0;
      render();
    });

    els.speedSelect.addEventListener('change', () => {
      if (playing) scheduleNext();
    });

    els.applyJsonBtn.addEventListener('click', () => {
      try {
        loadAnimation(JSON.parse(els.jsonInput.value), 'Pasted JSON applied.');
      } catch (error) {
        els.status.textContent = `Error: ${error.message}`;
      }
    });

    els.fileInput.addEventListener('change', async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        loadAnimation(JSON.parse(text), `Loaded ${file.name}`);
      } catch (error) {
        els.status.textContent = `Error: ${error.message}`;
      } finally {
        event.target.value = '';
      }
    });

    document.addEventListener('keydown', event => {
      if (event.target.matches('textarea, input, select')) return;
      if (event.code === 'Space') {
        event.preventDefault();
        playing ? pause() : play();
      } else if (event.key === 'ArrowRight') {
        pause();
        currentStep = Math.min(animation.steps.length - 1, currentStep + 1);
        render();
      } else if (event.key === 'ArrowLeft') {
        pause();
        currentStep = Math.max(0, currentStep - 1);
        render();
      }
    });

    window.addEventListener('load', () => {
      els.jsonInput.value = JSON.stringify(animation, null, 2);
      render();
      if (animation.settings?.autoPlay) play();
    });
  </script>
</body>
</html>
